<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="Provvigioni" />
    <meta name="apple-mobile-web-app-title" content="Provvigioni" />
    <link rel="manifest" href="/manifest.json" />
    <title>Provvigioni</title>
    <style>
      html, body, #root {
        min-height: 100%;
        background-color: #f0f9ff;
      }
      body {
        margin: 0;
      }
      html.dark, html.dark body, html.dark #root {
        background-color: #082f49 !important;
      }
      #app-startup-cover {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f0f9ff;
        opacity: 1;
        transition: opacity 180ms ease;
      }
      html.dark #app-startup-cover {
        background: #082f49;
      }
      #app-startup-cover[data-hiding="true"] {
        opacity: 0;
      }
      .startup-mark {
        width: 72px;
        height: 72px;
        border-radius: 22px;
        background: #0284c7;
        box-shadow: 0 18px 45px rgba(2, 132, 199, 0.2);
      }
      html.dark .startup-mark {
        background: #38bdf8;
        box-shadow: 0 18px 45px rgba(56, 189, 248, 0.18);
      }
    </style>
    <script>
      try {
        var isDark = false;
        var appMode = localStorage.getItem('app_dark_mode');
        var useSystem = localStorage.getItem('app_use_system_theme');
        if (useSystem === 'false') {
          isDark = appMode === 'true';
        } else {
          isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        if (isDark) {
          document.documentElement.classList.add('dark');
        }
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', isDark ? '#112b42' : '#ffffff');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app-startup-cover" aria-hidden="true">
      <div class="startup-mark"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
